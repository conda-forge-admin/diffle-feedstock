schema_version: 1

context:
  version: "0.1.5"

package:
  name: diffle
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@moritzwilksch/diffle/-/diffle-${{ version }}.tgz
  sha256: 070d8ed26a0d34acc7d787ab8293730b22228e1a5ffa7b18a11c10e2517e144a

build:
  number: 0

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs
  extras:
    python:
      - pyrefly >=1.3.0
    rust:
      - rust-analyzer
    typescript:
      - typescript-language-server
    go:
      - gopls
    ruby:
      - ruby-lsp
    java:
      - jdtls
    lua:
      - lua-language-server
    terraform:
      - terraform-ls
    json:
      - vscode-langservers-extracted
    yaml:
      - yaml-language-server
    toml:
      - tombi

tests:
  - package_contents:
      bin:
        - diffle
      files:
        - etc/pixi/diffle/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_diffle
            - share/bash-completion/completions/diffle
            - share/fish/vendor_completions.d/diffle.fish
  - script:
      - diffle --help
      - diffle --version

about:
  homepage: https://github.com/moritzwilksch/diffle
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/moritzwilksch/diffle

extra:
  recipe-maintainers:
    - moritzwilksch
    - pavelzw
